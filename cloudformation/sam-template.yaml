AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Metadata:
  'AWS::ServerlessRepo::Application':
    Name: SparkOnLambda
    Description: 'The Application creates AWS Lambda with Spark. Run your spark loads 75 to 80% less cost or FREE!! if you are within AWS Lambda free tier limits'
    Author: 'AWS Project Bluebear'
    SpdxLicenseId: MIT-0
    LicenseUrl: ../LICENSE.txt
    ReadmeUrl: ../README.md
    Labels:
      - spark
      - lambda
      - pyspark
      - serverless
    HomePageUrl: 'https://github.com/aws-samples/spark-on-aws-lambda'
    SemanticVersion: 1.2.0
    SourceCodeUrl: 'https://github.com/aws-samples/spark-on-aws-lambda'

Parameters:
  BuildTrigger:
    Type: String
    Default: v1
  BackupSuffix:
      Type: String
      Default: ''
  RoleName:
    Description: 'Mandatory: Base name for the IAM role created for the Lambda function (before BackupSuffix is appended)'
    Type: String
    Default: ''
  WorkloadType:
    Description: 'Mandatory: Which workload this stack runs, selects the IAM permissions attached to the Lambda role'
    Type: String
    Default: lineage
    AllowedValues:
      - lineage
      - whatsapp
  ImageUri:
    Description: 'Mandatory: ECR Uri for the image. If not present, then create and push using the sam-imagebuilder.yaml in the github https://github.com/aws-samples/spark-on-aws-lambda '
    Type: String
    Default: ''
  ScriptBucket:
    Type: String
    Description: 'Mandatory: Amazon S3 Bucket name where the spark script is stored. Just the bucket name e.g. bucket1'
  SparkScript:
    Type: String
    Description: 'Mandatory: Amazon S3 key where the spark script resides. Start without the /.eg: script/location/name.py'
  LambdaFunctionPrefix:
    Description: 'Optional: This is the prefix for the name of the lambda function that will be created. This name must satisfy the pattern ^[a-z0-9-_]{1,64}$'
    Type: String
    Default: SparkOnAWSLambda
  LambdaTimeout:
    Description: 'Optional: Maximum Lambda invocation runtime in seconds. (min 1 - 900 max)'
    Default: 300
    Type: Number
  LambdaMemory:
    Description: 'Optional: Lambda memory in MB (min 128 - 10,240 max).'
    Default: 1600
    Type: Number
  SparkLambdapermissionPolicyArn:
    Description: 'Optional: Arn of the policy that contains the permissions your spark job will need to run successfully'
    Type: String
    Default: ''
  AttachToVpc:
    Type: String
    Description: 'Mandatory: Set True or False to imply VPC Connectivity'
    Default: False
    AllowedValues:
      - True
      - False
  SecurityGroupIds:
    Description: 'Optional: One or more SecurityGroup IDs corresponding to the SecurityGroup that should be applied to the Lambda function. (e.g. sg1,sg2,sg3).Only used if AttachToVpc is True'
    Type: 'CommaDelimitedList'
    Default: ''
  SubnetIds:
    Description: 'Optional: One or more Subnet IDs corresponding to the Subnet that the Lambda function can use to access you data source. (e.g. subnet1,subnet2).Only used if AttachToVpc is True'
    Type: 'CommaDelimitedList'
    Default: ''
  
  Command:
    Description: 'Optional: Command override for the image. This is not required'
    Type: 'CommaDelimitedList'
    Default: "sparkLambdaHandler.lambda_handler"
  EntryPoint:
    Description: 'Optional: Entry Point override for the image'
    Type: 'CommaDelimitedList'
    Default: ''
  WorkingDirectory:
    Description: 'Optional: Command override for the image'
    Type: 'String'
    Default: ''
  LambdaVersion:
    Description: 'Optional: Value for the LAMBDA_VERSION environment variable'
    Type: String
    Default: ''
  WarehouseBucket:
    Description: 'Optional: S3 URI for the Iceberg warehouse bucket, used as the WAREHOUSE_BUCKET environment variable'
    Type: String
    Default: ''
  CrTableName:
    Description: 'Optional: Value for the CR_TABLE_NAME environment variable'
    Type: String
    Default: ''
  DatabaseName:
    Description: 'Optional: Value for the DATABASE_NAME environment variable'
    Type: String
    Default: ''
  IcbWorkgroup:
    Description: 'Optional: Value for the ICB_WG environment variable'
    Type: String
    Default: ''
  RcTableName:
    Description: 'Optional: Value for the RC_TABLE_NAME environment variable'
    Type: String
    Default: ''
  LineageVerifyTable:
    Description: 'Optional: Value for the LINEAGE_VERIFY_TABLE environment variable'
    Type: String
    Default: ''
  S3Bucket:
    Description: 'Optional: S3 bucket used to store WhatsApp media (env var S3_BUCKET)'
    Type: String
    Default: ''
  IcebergTableLocation:
    Description: 'Optional: S3 location of the Iceberg table (env var ICEBERG_TABLE_LOCATION)'
    Type: String
    Default: ''
  SqsQueueUrl:
    Description: 'Optional: SQS queue URL the Lambda consumes from (env var SQS_QUEUE_URL)'
    Type: String
    Default: ''
  GlueDatabase:
    Description: 'Optional: Glue database name (env var GLUE_DATABASE)'
    Type: String
    Default: ''
  IcebergTable:
    Description: 'Optional: Iceberg table name (env var ICEBERG_TABLE)'
    Type: String
    Default: ''
  S3ImagePrefix:
    Description: 'Optional: S3 key prefix for WhatsApp media images (env var S3_IMAGE_PREFIX)'
    Type: String
    Default: ''
  WhatsappAccessToken:
    Description: 'Optional: WhatsApp API access token (env var WHATSAPP_ACCESS_TOKEN)'
    Type: String
    NoEcho: True
    Default: ''

Conditions:
  NeedsVPC:  !Equals [ !Ref AttachToVpc, 'True' ]
  HasAdditionalPolicy: !Not  [ !Equals [ '', !Ref SparkLambdapermissionPolicyArn ] ]
  NeedsImageBuild: !Not [ !Equals [ !Ref ImageUri, '' ]]
  HasEntryPoint: !Not  [ !Equals [ '' , !Join [ ',',  !Ref EntryPoint ] ] ]
  HasWorkingDirectory: !Not  [ !Equals [ '', !Ref WorkingDirectory ] ]
  IsLineage: !Equals [ !Ref WorkloadType, 'lineage' ]
  IsWhatsapp: !Equals [ !Ref WorkloadType, 'whatsapp' ]

Resources:

  LambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${RoleName}${BackupSuffix}'
      Description: 'Role used by the lambda running spark'
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !If
            - IsLineage
            - "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess"
            - !Ref "AWS::NoValue"
        - !If
            - "HasAdditionalPolicy"
            - !Ref SparkLambdapermissionPolicyArn
            - !Ref "AWS::NoValue"
        - !If
            - NeedsVPC
            - "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
            - !Ref "AWS::NoValue"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - 'lambda.amazonaws.com'
            Action: 'sts:AssumeRole'

  LineagePolicyStack:
    Type: 'AWS::CloudFormation::Stack'
    Condition: IsLineage
    Properties:
      TemplateURL: ./policies/lineage-policy.yaml
      Parameters:
        ParentStackName: !Ref AWS::StackName
        RoleName: !Ref LambdaRole
        ImageUri: !Ref ImageUri

  WhatsappPolicyStack:
    Type: 'AWS::CloudFormation::Stack'
    Condition: IsWhatsapp
    Properties:
      TemplateURL: ./policies/whatsapp-policy.yaml
      Parameters:
        ParentStackName: !Ref AWS::StackName
        RoleName: !Ref LambdaRole
        ImageUri: !Ref ImageUri

  SparkLambda:
    Type: 'AWS::Serverless::Function'
    Properties:
      PackageType: Image
      FunctionName: !Sub '${LambdaFunctionPrefix}-${AWS::StackName}'
      ImageUri: !Sub
         - '${ImageUriPrefix}${BackupSuffix}:latest'
         - ImageUriPrefix: !Select [0, !Split [":", !Ref ImageUri]]


      # ReservedConcurrentExecutions: 1
      ImageConfig:
        Command: !Ref Command
        EntryPoint:
          !If
            - HasEntryPoint
            - !Ref EntryPoint
            - !Ref "AWS::NoValue"
        WorkingDirectory:
          !If
            - HasWorkingDirectory
            - !Ref WorkingDirectory
            - !Ref "AWS::NoValue"
      Description: "Lambda to run spark containers"
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemory
      Role: !GetAtt LambdaRole.Arn
      VpcConfig:
        !If
          - NeedsVPC
          -
            SecurityGroupIds: !Ref SecurityGroupIds
            SubnetIds: !Ref SubnetIds
          - !Ref "AWS::NoValue"
      Environment:
        Variables:
          SCRIPT_BUCKET: !Sub ${ScriptBucket}${BackupSuffix}
          SPARK_SCRIPT: !Ref SparkScript
          #INPUT_PATH: !Ref InputPath
          #OUTPUT_PATH: !Ref OutputPath
          LAMBDA_VERSION: !Ref LambdaVersion
          Rebuild: !Ref BuildTrigger
          CR_TABLE_NAME: !If [ IsLineage, !Ref CrTableName, !Ref "AWS::NoValue" ]
          DATABASE_NAME: !If [ IsLineage, !Ref DatabaseName, !Ref "AWS::NoValue" ]
          ICB_WG: !If [ IsLineage, !Ref IcbWorkgroup, !Ref "AWS::NoValue" ]
          RC_TABLE_NAME: !If [ IsLineage, !Ref RcTableName, !Ref "AWS::NoValue" ]
          WAREHOUSE_BUCKET: !If [ IsLineage, !Sub '${WarehouseBucket}${BackupSuffix}', !Ref "AWS::NoValue" ]
          LINEAGE_VERIFY_TABLE: !If [ IsLineage, !Ref LineageVerifyTable, !Ref "AWS::NoValue" ]
          GLUE_DATABASE: !If [ IsWhatsapp, !Ref GlueDatabase, !Ref "AWS::NoValue" ]
          ICEBERG_TABLE: !If [ IsWhatsapp, !Ref IcebergTable, !Ref "AWS::NoValue" ]
          S3_BUCKET: !If [ IsWhatsapp, !Sub '${S3Bucket}${BackupSuffix}', !Ref "AWS::NoValue" ]
          S3_IMAGE_PREFIX: !If [ IsWhatsapp, !Ref S3ImagePrefix, !Ref "AWS::NoValue" ]
          WHATSAPP_ACCESS_TOKEN: !If [ IsWhatsapp, !Ref WhatsappAccessToken, !Ref "AWS::NoValue" ]
          ICEBERG_TABLE_LOCATION: !If [ IsWhatsapp, !Sub '${IcebergTableLocation}${BackupSuffix}', !Ref "AWS::NoValue" ]
          SQS_QUEUE_URL: !If [ IsWhatsapp, !Ref SqsQueueUrl, !Ref "AWS::NoValue" ]
